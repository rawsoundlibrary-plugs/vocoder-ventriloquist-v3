name: Build vocoder ventriloquist

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        shell: bash
        run: |
          FILE=$(find . -name CMakeLists.txt -not -path "./build/*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::CMakeLists.txt introuvable : les fichiers du projet ne sont pas dans le depot."
            exit 1
          fi
          echo "SRC=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: cmake -S "$SRC" -B build -DCMAKE_BUILD_TYPE=Release -DVQ_INSTALL_AFTER_BUILD=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp -R build/*_artefacts/Release/VST3/*.vst3 dist/
          cp -R build/*_artefacts/Release/AU/*.component dist/
          codesign --force --deep --sign - dist/*.vst3
          codesign --force --deep --sign - dist/*.component
          cd dist && zip -r -y ../VocoderVentriloquist-macOS.zip .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/*_artefacts/Release/VST3/*.vst3 dist/
          Compress-Archive -Path dist/* -DestinationPath VocoderVentriloquist-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: VocoderVentriloquist-${{ matrix.name }}
          path: VocoderVentriloquist-${{ matrix.name }}.zip
